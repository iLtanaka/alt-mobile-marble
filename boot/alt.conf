# extlinux configuration for ALT Mobile on Xiaomi Poco F5 (marble)
timeout 3
default alt

label alt
	menu label ALT Mobile Sisyphus (Phosh)
	kernel /alt/vmlinuz
	fdt /alt/sm8475-xiaomi-marble.dtb
	append root=PARTLABEL=rootfs2 rootflags=compress=zstd:3 rootwait rw console=tty0 loglevel=4 printk.devkmsg=on pstore.compress=none log_buf_len=2M msm_geni_serial.con_enabled=0 clk_ignore_unused pd_ignore_unused regulator_ignore_unused fw_devlink=permissive pcie_aspm=off
