# extlinux entry for ALT Mobile on the Xiaomi Poco F5 (marble).
#
# kernel and fdt are copies from postmarketOS in /alt/: the modules inside the
# ALT root filesystem belong to exactly that kernel. Do not point this at
# ALT's own /boot/vmlinuz-*-qualcomm-sdm845-* (that kernel has no marble support).
#
# The first line is what scripts/install-on-phone.sh puts into the U-Boot
# "Other systems..." menu.
# marble-port: title=ALT Mobile Sisyphus
#
# root= uses the PARTUUID of the target partition; find it with
#   blkid -s PARTUUID -o value /dev/disk/by-partlabel/rootfs2
# scripts/install-on-phone.sh fills it in; the value below is a placeholder.
#
# This file alone does nothing: U-Boot also needs /extlinux/others.env with a
# "bootmenu_N=" line that sysboots it (see the README).
timeout 1
default alt

label alt
	kernel /alt/vmlinuz
	fdt /alt/sm8475-xiaomi-marble.dtb
	append root=PARTUUID=<partuuid-of-rootfs2> rootfstype=btrfs rootflags=compress=zstd:3 rootwait rw console=tty0 loglevel=4 printk.devkmsg=on pstore.compress=none log_buf_len=2M msm_geni_serial.con_enabled=0 clk_ignore_unused pd_ignore_unused regulator_ignore_unused fw_devlink=permissive pcie_aspm=off
